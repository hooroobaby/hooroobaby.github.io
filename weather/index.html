<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb347 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 98%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #ff8c69;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ff8c69;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            font-size: 16px;
            border: 2px solid #ff8c69;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #ff6b47;
            box-shadow: 0 0 0 3px rgba(255, 140, 105, 0.1);
        }
        
        select {
            flex: 1;
            min-width: 200px;
        }
        
        button {
            background: #ff8c69;
            color: white;
            font-weight: bold;
            min-width: 120px;
        }
        
        button:hover {
            background: #ff6b47;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 105, 0.4);
        }
        
        .quick-cities {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .quick-cities button {
            padding: 8px 16px;
            font-size: 14px;
            background: black;
            border: 2px solid #e0e0e0;
            min-width: auto;
        }
        
        .quick-cities button:hover {
            border-color: #ff8c69;
            background: #fff5f2;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #ff8c69;
            font-size: 1.2em;
        }
        
        .weather-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        
        .weather-grid::-webkit-scrollbar {
            height: 10px;
        }
        
        .weather-grid::-webkit-scrollbar-track {
            background: rgba(255, 140, 105, 0.1);
            border-radius: 10px;
        }
        
        .weather-grid::-webkit-scrollbar-thumb {
            background: #ff8c69;
            border-radius: 10px;
        }
        
        .weather-grid::-webkit-scrollbar-thumb:hover {
            background: #ff6b47;
        }
        
        .weather-card {
            background: linear-gradient(135deg, #ff8c69 0%, #ffb347 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            min-width: 300px;
            flex-shrink: 0;
            scroll-snap-align: start;
        }
        
        .weather-card.now-card {
            min-width: 200px;
            padding: 15px;
        }
        
        .weather-card.full-width {
            min-width: 100%;
        }
        
        .weather-card:hover {
            transform: translateY(-5px);
        }
        
        .weather-card h3 {
            font-size: 1.3em;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
        }
        
        .weather-info {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .weather-info span {
            font-size: 1.1em;
        }
        
        .icon {
            font-size: 1.5em;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: #ff8c69;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #ff6b47;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Global Weather forecast</h1>
        <p style="text-align: center; color: #a9a9a9; font-size: 0.9em; margin-bottom: 20px; font-style: italic;">
            免費的只能五天ＱＱ
        </p>
        
        <div class="controls">
            <input type="text" id="cityInput" placeholder="what city~" />
            <button onclick="getWeather()">Search City!</button>
            <button onclick="getLocationWeather()" style="background: #48bb78;">📍 My Location</button>
        </div>
        
        <div class="quick-cities">
            <button onclick="getRecommendation()" style="background: #f8b524; color: #333; font-weight: bold; border: 2px solid #ffb347;">
                ⭐ Recommend Best City
            </button>
            <button onclick="quickSearch('Taipei')"> 🇹🇼 Taipei</button>
            <button onclick="quickSearch('Yilan')"> 🇹🇼 Yilan</button>
            <button onclick="quickSearch('Busan')"> 🇰🇷 Busan</button>
            <button onclick="quickSearch('Tokyo')"> 🇯🇵 Tokyo</button>
            <button onclick="quickSearch('Kyoto')"> 🇯🇵 Kyoto</button>
            <button onclick="quickSearch('Singapore')"> 🇸🇬 Singapore</button>
            <button onclick="quickSearch('London')"> 🇬🇧 London</button>
            <button onclick="quickSearch('Seattle')"> 🇺🇸 Seattle</button>
        </div>
        
        <div id="weatherResult"></div>
        
        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <!-- Load config file (ignored by git) -->
    <script src="config.js"></script>
    <script>
        // OpenWeatherMap API Key (loaded from config.js)
        const API_KEY = WEATHER_CONFIG.API_KEY;
        
        function quickSearch(city) {
            document.getElementById('cityInput').value = city;
            getWeather();
        }
        
        async function getRecommendation() {
            const resultDiv = document.getElementById('weatherResult');
            resultDiv.innerHTML = '<div class="loading">🔍 Analyzing weather in all cities...</div>';
            
            // Helper function to determine if weather is bad (rainy/cloudy/stormy)
            function isRainyWeather(weather) {
                const main = weather.main.toLowerCase();
                const description = weather.description.toLowerCase();
                
                // Bad weather conditions
                const badConditions = ['rain', 'drizzle', 'thunderstorm', 'snow', 'mist', 'fog', 'overcast clouds'];
                
                return badConditions.some(condition => 
                    main.includes(condition) || description.includes(condition)
                );
            }
            
            // List of cities to check
            const cities = ['Taipei', 'Yilan', 'Busan', 'Tokyo', 'Kyoto', 'Singapore', 'London', 'Seattle'];
            const weatherData = [];
            
            try {
                // First, try to get user's location
                let userLocation = null;
                if (navigator.geolocation) {
                    try {
                        const position = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                        });
                        
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        const response = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=en`
                        );
                        
                        if (response.ok) {
                            const data = await response.json();
                            userLocation = {
                                name: data.name,
                                temp: data.main.temp,
                                rain: isRainyWeather(data.weather[0]),
                                description: data.weather[0].description,
                                weatherMain: data.weather[0].main
                            };
                        }
                    } catch (e) {
                        console.log('Could not get user location');
                    }
                }
                
                // Fetch weather for all cities
                for (const city of cities) {
                    try {
                        const response = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=en`
                        );
                        
                        if (response.ok) {
                            const data = await response.json();
                            weatherData.push({
                                name: data.name,
                                temp: data.main.temp,
                                rain: isRainyWeather(data.weather[0]),
                                description: data.weather[0].description,
                                humidity: data.main.humidity,
                                icon: data.weather[0].icon,
                                weatherMain: data.weather[0].main
                            });
                        }
                    } catch (e) {
                        console.error(`Error fetching ${city}:`, e);
                    }
                }
                
                // Find best city: clear weather + comfortable temperature (not over 26°C)
                const clearWeatherCities = weatherData.filter(city => !city.rain);
                const comfortableClearCities = clearWeatherCities.filter(city => city.temp <= 26);
                
                let bestCity;
                if (comfortableClearCities.length > 0) {
                    // If there are clear weather cities with comfortable temp, pick the warmest one
                    bestCity = comfortableClearCities.reduce((max, city) => city.temp > max.temp ? city : max);
                } else if (clearWeatherCities.length > 0) {
                    // If clear weather cities exist but all are too hot, pick the coolest one
                    bestCity = clearWeatherCities.reduce((min, city) => city.temp < min.temp ? city : min);
                } else {
                    // If all cities have bad weather, pick the one with best temperature (closest to 20-26°C)
                    bestCity = weatherData.reduce((best, city) => {
                        const bestDiff = Math.abs(best.temp - 23); // 23°C is ideal
                        const cityDiff = Math.abs(city.temp - 23);
                        return cityDiff < bestDiff ? city : best;
                    });
                }
                
                // Find hottest overall
                const hottestCity = weatherData.reduce((max, city) => city.temp > max.temp ? city : max);
                
                // Build recommendation message
                let recommendationHTML = '<div class="weather-card full-width" style="min-width: 100%; background: linear-gradient(135deg, #ffd700 0%, #f8b524 100%);">';
                recommendationHTML += '<h3>Weather Recommendation</h3>';
                
                // Show user location first if available
                if (userLocation) {
                    const userWeatherIcon = userLocation.rain ? '☁️' : '☀️';
                    const userWeatherStatus = userLocation.rain ? 'Cloudy/Rainy' : 'Clear';
                    recommendationHTML += `
                        <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 10px; margin: 15px 0;">
                            <h4 style="margin-bottom: 10px;">📍 Your Location: ${userLocation.name}</h4>
                            <p style="font-size: 1.1em;">🌡️ ${Math.round(userLocation.temp)}°C • ${userWeatherIcon} ${userWeatherStatus}</p>
                            <p style="opacity: 0.9;">${userLocation.description} (${userLocation.weatherMain})</p>
                        </div>
                    `;
                }
                
                // Show best recommendation
                if (!bestCity.rain && bestCity.temp <= 26) {
                    recommendationHTML += `
                        <div style="background: rgba(255,255,255,0.3); padding: 20px; border-radius: 10px; margin: 15px 0;">
                            <h4 style="font-size: 1.3em; margin-bottom: 10px;">🎉 Best Choice: ${bestCity.name}</h4>
                            <p style="font-size: 1.2em; margin: 10px 0;">
                                ☀️ Clear weather • 🌡️ ${Math.round(bestCity.temp)}°C (Perfect!)
                            </p>
                            <p style="opacity: 0.9;">${bestCity.description} (${bestCity.weatherMain})</p>
                            <button onclick="quickSearch('${bestCity.name}')" style="margin-top: 15px; background: white; color: #ff8c69; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
                                Check out this place! →
                            </button>
                        </div>
                    `;
                } else if (!bestCity.rain && bestCity.temp > 26) {
                    recommendationHTML += `
                        <div style="background: rgba(255,255,255,0.3); padding: 20px; border-radius: 10px; margin: 15px 0;">
                            <h4 style="font-size: 1.3em; margin-bottom: 10px;">☀️ Clear but Hot: ${bestCity.name}</h4>
                            <p style="font-size: 1.2em; margin: 10px 0;">
                                ☀️ Clear weather • 🌡️ ${Math.round(bestCity.temp)}°C (Too hot!)
                            </p>
                            <p style="opacity: 0.9;">${bestCity.description} (${bestCity.weatherMain})</p>
                            <p style="margin-top: 10px; font-size: 0.9em;">⚠️ Temperature over 26°C - might be uncomfortable</p>
                        </div>
                    `;
                } else {
                    recommendationHTML += `
                        <div style="background: rgba(255,255,255,0.3); padding: 20px; border-radius: 10px; margin: 15px 0;">
                            <h4 style="font-size: 1.3em; margin-bottom: 10px;">🌡️ Best Available: ${bestCity.name}</h4>
                            <p style="font-size: 1.2em; margin: 10px 0;">
                                ${Math.round(bestCity.temp)}°C • ${bestCity.rain ? '☁️ Cloudy/Rainy' : '☀️ Clear'}
                            </p>
                            <p style="opacity: 0.9;">${bestCity.description} (${bestCity.weatherMain})</p>
                            <p style="margin-top: 10px; font-size: 0.9em;">⚠️ All cities have cloudy or rainy weather today</p>
                        </div>
                    `;
                }
                
                // Show comparison table
                recommendationHTML += '<div style="margin-top: 20px;"><h3 style="margin-bottom: 10px;">All Cities Comparison:</h3>';
                recommendationHTML += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">';
                
                weatherData.sort((a, b) => b.temp - a.temp).forEach(city => {
                    const weatherIcon = city.rain ? '☁️' : '☀️';
                    const isBest = city.name === bestCity.name && !city.rain;
                    recommendationHTML += `
                        <div style="background: ${isBest ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.2)'}; padding: 10px; border-radius: 8px; ${isBest ? 'border: 2px solid white;' : ''}">
                            <div style="font-weight: bold;">${city.name} ${isBest ? '⭐' : ''}</div>
                            <div>${Math.round(city.temp)}°C ${weatherIcon}</div>
                            <div style="font-size: 0.85em; opacity: 0.9;">${city.weatherMain}</div>
                        </div>
                    `;
                });
                
                recommendationHTML += '</div></div></div>';
                
                resultDiv.innerHTML = recommendationHTML;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <p>Unable to get weather recommendations</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Please try again later</p>
                    </div>
                `;
            }
        }
        
        async function getLocationWeather() {
            const resultDiv = document.getElementById('weatherResult');
            
            if (!navigator.geolocation) {
                resultDiv.innerHTML = '<div class="error">Your browser does not support geolocation</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">Getting your location...</div>';
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    try {
                        // Get current weather by coordinates
                        const currentResponse = await fetch(
                            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=en`
                        );
                        
                        if (!currentResponse.ok) {
                            throw new Error('Unable to fetch weather data');
                        }
                        
                        const currentData = await currentResponse.json();
                        
                        // Get 5-day forecast by coordinates
                        const forecastResponse = await fetch(
                            `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=en`
                        );
                        
                        const forecastData = await forecastResponse.json();
                        
                        // Update input field with city name
                        document.getElementById('cityInput').value = currentData.name;
                        
                        displayWeather(currentData, forecastData);
                        
                    } catch (error) {
                        console.error('Error:', error);
                        resultDiv.innerHTML = `
                            <div class="error">
                                <p>Unable to fetch weather data</p>
                                <p style="font-size: 0.9em; margin-top: 10px;">Please try again later</p>
                            </div>
                        `;
                    }
                },
                (error) => {
                    let errorMessage = 'Unable to get your location';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = 'Location permission denied. Please enable location access in your browser settings.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMessage = 'Location request timed out.';
                            break;
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="error">
                            <p>${errorMessage}</p>
                            <p style="font-size: 0.9em; margin-top: 10px;">You can still search by city name</p>
                        </div>
                    `;
                }
            );
        }
        
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const resultDiv = document.getElementById('weatherResult');
            
            if (!city) {
                resultDiv.innerHTML = '<div class="error">Please enter a city name!</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="loading">Loading...</div>';
            
            try {
                // Get current weather
                const currentResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=en`
                );
                
                if (!currentResponse.ok) {
                    throw new Error('City not found');
                }
                
                const currentData = await currentResponse.json();
                
                // Get 5-day forecast
                const forecastResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=en`
                );
                
                const forecastData = await forecastResponse.json();
                
                displayWeather(currentData, forecastData);
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <p>Unable to fetch weather data</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">
                            ${error.message === 'City not found' ? 'Please check the city name' : 'Please try again later'}
                        </p>
                        <p style="font-size: 0.85em; margin-top: 10px; opacity: 0.8;">
                            Tip: Try using English names like "Taipei", "Tokyo", "London"
                        </p>
                    </div>
                `;
            }
        }
        
        function displayWeather(current, forecast) {
            const resultDiv = document.getElementById('weatherResult');
            
            // Get weather icon
            const getWeatherIcon = (code) => {
                const icons = {
                    '01': '☀️', '02': '⛅', '03': '☁️', '04': '☁️',
                    '09': '🌧️', '10': '🌦️', '11': '⛈️', '13': '❄️', '50': '🌫️'
                };
                return icons[code.substring(0, 2)] || '🌤️';
            };
            
            // Process forecast data - get noon data for each day
            const dailyForecasts = [];
            const processedDates = new Set();
            
            forecast.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const dateStr = date.toLocaleDateString('en-US');
                const hour = date.getHours();
                
                // Get data around noon (12 PM)
                if (hour >= 11 && hour <= 13 && !processedDates.has(dateStr) && dailyForecasts.length < 5) {
                    processedDates.add(dateStr);
                    dailyForecasts.push({
                        date: dateStr,
                        temp: Math.round(item.main.temp),
                        tempMin: Math.round(item.main.temp_min),
                        tempMax: Math.round(item.main.temp_max),
                        weather: item.weather[0].description,
                        icon: getWeatherIcon(item.weather[0].icon),
                        humidity: item.main.humidity,
                        windSpeed: item.wind.speed
                    });
                }
            });
            
            // Display current weather
            const currentHTML = `
                <div class="weather-card">
                    <h3>📍 ${current.name}, ${current.sys.country}</h3>
                    <div style="font-size: 3em; text-align: center; margin: 15px 0;">${getWeatherIcon(current.weather[0].icon)}</div>
                    <div style="text-align: center; margin-bottom: 15px;">
                        <div style="font-size: 2em; font-weight: bold;">${Math.round(current.main.temp)}°C</div>
                        <div style="font-size: 0.9em; opacity: 0.9;">${current.weather[0].description}</div>
                    </div>
                    <div class="weather-info">
                        <span class="icon">🌡️</span>
                        <span>Feels like ${Math.round(current.main.feels_like)}°C</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">💧</span>
                        <span>Humidity ${current.main.humidity}%</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">�</span>
                        <span>Wind ${current.wind.speed} m/s</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">�️</span>
                        <span>Visibility ${(current.visibility / 1000).toFixed(1)} km</span>
                    </div>
                </div>
            `;
            
            // Display forecast for upcoming days
            const forecastHTML = dailyForecasts.map(day => `
                <div class="weather-card">
                    <h3>${day.date}</h3>
                    <div style="font-size: 3em; text-align: center; margin: 15px 0;">${day.icon}</div>
                    <div class="weather-info">
                        <span class="icon">🌡️</span>
                        <span>${day.tempMin}°C ~ ${day.tempMax}°C</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">☁️</span>
                        <span>${day.weather}</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">💧</span>
                        <span>Humidity ${day.humidity}%</span>
                    </div>
                    <div class="weather-info">
                        <span class="icon">💨</span>
                        <span>Wind ${day.windSpeed} m/s</span>
                    </div>
                </div>
            `).join('');
            
            resultDiv.innerHTML = `
                <div style="text-align: center; color: #ff8c69; margin-bottom: 10px; font-size: 0.9em;">
                    👈 Swipe to see more days 👉
                </div>
                <div class="weather-grid">
                    ${currentHTML}
                    ${forecastHTML}
                </div>
            `;
        }
        
        // Load recommendation on page load
        window.onload = function() {
            // Auto-show recommendation
            getRecommendation();
            
            // Support Enter key for search
            document.getElementById('cityInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    getWeather();
                }
            });
        };
    </script>
</body>
</html>
